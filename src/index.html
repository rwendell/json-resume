<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryan Wendell</title>
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; }
        nav {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #e0e0e0;
            padding: 0 2rem;
            gap: 0;
        }
        nav button {
            padding: 0.75rem 1.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s, border-color 0.2s;
        }
        nav button:hover { color: #333; }
        nav button.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
            font-weight: 600;
        }
        .download-btn {
            margin-left: auto;
            padding: 0.5rem 1rem;
            border: 1px solid #e0e0e0;
            background: white;
            cursor: pointer;
            font-size: 0.9rem;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #f5f5f5; }
        .download-btn.hidden { display: none; }
        iframe {
            width: 100%;
            border: none;
            height: calc(100vh - 50px);
        }
    </style>
</head>
<body>
    <nav id="nav">
        <a id="download" class="download-btn hidden" download>Download PDF</a>
    </nav>
    <iframe id="frame"></iframe>
    <script>
        const resumes = [
            { id: 'software-engineer', label: 'Software Engineer', pdf: true },
            { id: 'barista', label: 'Barista', pdf: true },
        ];
        const defaultResume = 'software-engineer';

        const frame = document.getElementById('frame');
        const nav = document.getElementById('nav');
        const downloadBtn = document.getElementById('download');

        function load(id) {
            const resume = resumes.find(r => r.id === id) || resumes.find(r => r.id === defaultResume);
            frame.src = resume.id + '.html';
            location.hash = resume.id;
            
            document.querySelectorAll('nav button').forEach(b =>
                b.classList.toggle('active', b.dataset.resume === resume.id));
            
            if (resume.pdf) {
                downloadBtn.href = resume.id + '.pdf';
                downloadBtn.download = resume.id + '.pdf';
                downloadBtn.classList.remove('hidden');
            } else {
                downloadBtn.classList.add('hidden');
            }
        }

        resumes.forEach(r => {
            const btn = document.createElement('button');
            btn.textContent = r.label;
            btn.dataset.resume = r.id;
            btn.onclick = () => load(r.id);
            nav.insertBefore(btn, downloadBtn);
        });

        load(location.hash.slice(1) || defaultResume);
    </script>
</body>
</html>
