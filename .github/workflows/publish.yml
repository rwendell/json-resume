name: Publish Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      gist-id: ${{ steps.gist.outputs.gist-id }}
      resume-files: ${{ steps.fetch-gist-files.outputs.resume-files }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch resume files from gist (source of truth)
        id: fetch-gist-files
        run: |
          # Get all files from YOUR specific gist
          echo "Fetching files from gist..."
          GIST_DATA=$(curl -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            "https://api.github.com/gists/e597887d6598c25d2b880c079c6937fe")
          
          # Check if we got valid data
          if [ "$GIST_DATA" = "" ] || [ "$GIST_DATA" = "null" ]; then
            echo "::error::Failed to fetch gist data. Check GIST_TOKEN secret."
            exit 1
          fi
          
          # Extract all .json files from gist
          FILE_NAMES=$(echo "$GIST_DATA" | jq -r '.files | to_entries[] | select(.key | endswith(".json")) | .key')
          
          if [ "$FILE_NAMES" = "" ]; then
            echo "::error::No .json files found in gist."
            exit 1
          fi
          
          echo "Found files in gist: $FILE_NAMES"
          
          # All .json files are potential resume files
          RESUME_FILES=$(echo "$FILE_NAMES" | jq -R . | jq -s .)
          
          echo "Processing resume files: $RESUME_FILES"
          echo "resume-files=$RESUME_FILES" >> $GITHUB_OUTPUT

      - name: Download and prepare resume data
        id: prepare-data
        run: |
          RESUME_FILES="${{ steps.fetch-gist-files.outputs.resume-files }}"
          
          if [ "$RESUME_FILES" = "" ] || [ "$RESUME_FILES" = "null" ]; then
            echo "::error::No resume files to process."
            exit 1
          fi
          
          # For each .json file, download content from gist and save locally
          while IFS= read -r file; do
            filename=$(echo "$file" | tr -d '"')
            echo "Processing $filename from gist..."
            
            # Get file content from gist
            CONTENT_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
              "https://api.github.com/gists/e597887d6598c25d2b880c079c6937fe/$filename")
            
            # Check if curl was successful
            if echo "$CONTENT_RESPONSE" | jq -e '.content' > /dev/null 2>&1; then
              CONTENT=$(echo "$CONTENT_RESPONSE" | jq -r '.content')
              echo "$CONTENT" > "src/$filename"
              echo "Successfully prepared src/$filename"
            else
              echo "::warning::Could not download $filename (may not exist in gist)"
            fi
          done <<< "$(echo "$RESUME_FILES" | jq -r '.[]')"

      - name: Build all resumes from gist-sourced data
        run: |
          # Build resumes using the data fetched from gist
          echo "Starting resume build process..."
          npm run build

      - name: Update Gist metadata
        id: gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -n "${{ secrets.GIST_ID }}" ]; then
            curl -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/gists/${{ secrets.GIST_ID }}" \
              -d '{"description": "Ryan Wendell - JSON Resumes (updated by workflow)"}'
            echo "gist-id=${{ secrets.GIST_ID }}" >> $GITHUB_OUTPUT
          else
            RESPONSE=$(curl -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/gists" \
              -d '{"public": true, "description": "Ryan Wendell - JSON Resumes", "files": {}}')
            NEW_GIST_ID=$(echo "$RESPONSE" | jq -r .id)
            echo "gist-id=$NEW_GIST_ID" >> $GITHUB_OUTPUT
            echo "::notice::Created new gist: https://gist.github.com/$NEW_GIST_ID"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-to-github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-to-github-io-repo:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to github.io repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_IO_DEPLOY_KEY }}
          external_repository: ${{ secrets.GH_IO_REPO }}
          publish_branch: main
          publish_dir: ./dist
          commit_message: "Update resume from source repo"
