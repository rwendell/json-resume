name: Publish Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GIST_ID: e597887d6598c25d2b880c079c6937fe

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate resume data
        run: npm run validate all

      - name: Build all resumes
        run: npm run build

      - name: Mirror resume JSON files to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "::warning::GIST_TOKEN is not configured; skipping gist mirror."
            exit 0
          fi

          CURRENT_FILES=$(find src -maxdepth 1 -type f -name '*.json' -printf '%f\n' | jq -R -s 'split("\n") | map(select(length > 0))')
          EXISTING_FILES=$(curl --fail --silent --show-error \
            "https://api.github.com/gists/$GIST_ID" | \
            jq -c '[.files | keys[] | select(endswith(".json"))]')

          UPDATES=$(find src -maxdepth 1 -type f -name '*.json' -print0 |
            while IFS= read -r -d '' file; do
              name=$(basename "$file")
              content=$(cat "$file")
              jq -n --arg name "$name" --arg content "$content" '{key: $name, value: {content: $content}}'
            done | jq -s 'from_entries')

          DELETIONS=$(jq -n --argjson existing "$EXISTING_FILES" --argjson current "$CURRENT_FILES" \
            '$existing - $current | map({key: ., value: null}) | from_entries')
          FILES=$(jq -n --argjson updates "$UPDATES" --argjson deletions "$DELETIONS" \
            '$updates * $deletions')
          PAYLOAD=$(jq -n --argjson files "$FILES" '{files: $files}')

          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d "$PAYLOAD"
          echo "Gist mirror updated: $GIST_ID"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-to-github-pages:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-to-github-io-repo:
    needs: build
    if: vars.GH_IO_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to github.io repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GIST_TOKEN }}
          external_repository: ${{ vars.GH_IO_REPO }}
          publish_branch: main
          publish_dir: ./dist
          commit_message: "Update resume from source repository"
