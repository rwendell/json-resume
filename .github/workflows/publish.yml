name: Publish Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/aube-action@v1
        with:
          node-version: "20"
          run-install: true

      - name: Ensure Chromium is available for PDF export
        run: aube exec --no-install -- puppeteer browsers install chrome

      - name: Validate resume data
        run: aube run validate -- all

      - name: Build all resumes
        run: aube run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-to-github-pages:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-portfolio:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch portfolio resume sync
        env:
          TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::GIST_TOKEN is not configured; skipping portfolio sync."
            exit 0
          fi

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/rwendell/rwendell.github.io/dispatches \
            -d '{"event_type":"resume-updated"}'
