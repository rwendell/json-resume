name: Publish Resume

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

env:
  GIST_ID: e597887d6598c25d2b880c079c6937fe

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      resume-files: ${{ steps.fetch-gist-files.outputs.resume-files }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch resume files from gist
        id: fetch-gist-files
        run: |
          # The public gist is the source of truth. No token is needed to read it.
          curl --fail --silent --show-error \
            "https://api.github.com/gists/$GIST_ID" > /tmp/resume-gist.json

          FILE_NAMES=$(jq -r '.files | keys[] | select(. != "JSON-RESUME" and endswith(".json"))' /tmp/resume-gist.json)
          if [ -z "$FILE_NAMES" ]; then
            echo "::error::No resume JSON files found in gist $GIST_ID."
            exit 1
          fi

          echo "Found resume files in gist:"
          echo "$FILE_NAMES"
          {
            echo 'resume-files<<EOF'
            printf '%s\n' "$FILE_NAMES" | jq -R -s 'split("\n") | map(select(length > 0))'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare resume data from gist
        run: |
          # Delete checked-in JSON files so removed gist files cannot be built.
          find src -maxdepth 1 -type f -name '*.json' -delete

          jq -r '.files | keys[] | select(. != "JSON-RESUME" and endswith(".json"))' /tmp/resume-gist.json |
          while IFS= read -r filename; do
            jq -r --arg filename "$filename" '.files[$filename].content' /tmp/resume-gist.json > "src/$filename"
            jq empty "src/$filename"
            echo "Prepared src/$filename"
          done

      - name: Build all resumes from gist
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-to-github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-to-github-io-repo:
    needs: build
    if: vars.GH_IO_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to github.io repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_IO_DEPLOY_KEY }}
          external_repository: ${{ vars.GH_IO_REPO }}
          publish_branch: main
          publish_dir: ./dist
          commit_message: "Update resume from source gist"
