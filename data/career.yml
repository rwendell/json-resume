generic:
  title: Software Engineer
  publishAs: software-engineer
  description: >-
    Build a general-purpose software engineering resume, not tailored to a
    specific job posting. Select the strongest and most broadly useful evidence
    from the fact bank.

    Prioritize achievements with the highest strength values, quantified
    outcomes, and breadth across full-stack engineering, APIs and integrations,
    data pipelines, cloud platforms, security, customer-facing delivery,
    LLM-assisted development, and systems/tooling work in Go, Kotlin, Python,
    Linux, Android, Nix, USB, or open-source projects. Show progression across
    roles and include 2-3 projects from different domains.

    Avoid over-specializing in one employer, industry, or technology. Prefer
    recent, high-impact work while keeping older roles to one strong highlight.
    The result must fit on one page and fill it.
